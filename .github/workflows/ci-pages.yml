name: TaxMetric required checks
on:
  pull_request:
  push:
    branches: [main, feature/canada-tax-opportunity-catalog]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taxmetric-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: tests-build-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Tracked-file security gate
        run: node scripts/security-check.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: taxmetric-test-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
# Production publishing is intentionally disabled pending review and host-level gates.
