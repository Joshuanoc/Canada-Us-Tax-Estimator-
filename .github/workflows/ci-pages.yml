name: TaxMetric required checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/canada-tax-opportunity-catalog]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: taxmetric-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    uses: ./.github/workflows/security.yml
  validate:
    name: tests-build-security
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: node scripts/security-check.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - name: Package tested Pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: taxmetric-test-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  deploy:
    name: release-tested-standard-mode
    needs: [security, validate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require Actions-only Pages publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pages`, {
            headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'}
          });
          if (!response.ok) throw new Error(`Could not verify Pages source (HTTP ${response.status}).`);
          const pages = await response.json();
          if (pages.build_type !== 'workflow') {
            throw new Error('Set repository Settings > Pages > Source to GitHub Actions. Branch publishing bypasses the test gate.');
          }
          JS
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish tested artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
