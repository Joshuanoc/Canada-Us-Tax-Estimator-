name: TaxMetric required checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/canada-tax-opportunity-catalog]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: taxmetric-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    uses: ./.github/workflows/security.yml
  validate:
    name: tests-build-security
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: node scripts/security-check.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: taxmetric-test-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
# Publishing remains disabled pending review and host-level release gates.
